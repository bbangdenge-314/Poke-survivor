<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>포켓 서바이버 · Poke Survivor</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23fff' stroke='%230b1020' stroke-width='8'/><path d='M4 50h92' stroke='%230b1020' stroke-width='10'/><circle cx='50' cy='50' r='15' fill='%23ef4444' stroke='%230b1020' stroke-width='6'/></svg>">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-left">
      <div class="portrait"><img id="hudPortrait" alt=""></div>
      <div class="hud-bars">
        <div class="hud-line"><span id="hudName">피카츄</span><span id="hudLevel" class="lvl">Lv.1</span></div>
        <div class="bar hp"><i id="hpBar"></i><span id="hpText">100 / 100</span></div>
      </div>
    </div>
    <div class="hud-center">
      <div class="timer" id="timer">00:00</div>
      <div class="stage-tag" id="stageTag">관동 초원</div>
    </div>
    <div class="hud-right">
      <div class="stat-chip"><b id="killCount">0</b><span>처치</span></div>
      <div class="stat-chip gold"><b id="coinCount">0</b><span>코인</span></div>
      <button id="pauseBtn" class="icon-btn" aria-label="일시정지">❚❚</button>
    </div>
  </div>
  <div id="bossBar" class="boss-bar hidden">
    <div class="boss-name"><b id="bossName">BOSS</b><span id="bossHpText"></span></div>
    <div class="bar boss"><i id="bossFill"></i></div>
  </div>
  <div class="weapon-row" id="weaponRow"></div>
  <div class="xp-wrap"><div class="xp-bar"><i id="xpBar"></i></div><span id="xpText">0%</span></div>
</div>

<!-- ================= 화면 루트 ================= -->
<div id="screenRoot"></div>

<!-- ================= 레벨업 ================= -->
<div id="levelupOverlay" class="overlay hidden">
  <div class="lu-head">
    <div class="lu-kicker">LEVEL UP!</div>
    <h2>기술을 선택하세요</h2>
    <p>하나를 골라 더 강해지세요</p>
  </div>
  <div id="cardList" class="card-list"></div>
</div>

<!-- ================= 진화 ================= -->
<div id="evoOverlay" class="overlay evo hidden">
  <div class="evo-inner">
    <div class="evo-kicker" id="evoKicker">EVOLUTION</div>
    <div class="evo-sprites">
      <img id="evoFrom" class="evo-from" alt="">
      <div class="evo-arrow">➜</div>
      <img id="evoTo" class="evo-to" alt="">
    </div>
    <h2 id="evoName">리자몽</h2>
    <p id="evoDesc">새로운 힘이 깨어났다!</p>
    <button id="evoOk" class="btn primary">계속</button>
  </div>
</div>

<!-- ================= 분기 진화 ================= -->
<div id="branchOverlay" class="overlay hidden">
  <div class="lu-head">
    <div class="lu-kicker">BRANCH EVOLUTION</div>
    <h2>어떤 모습으로 진화할까?</h2>
    <p>이브이의 운명을 선택하세요</p>
  </div>
  <div id="branchList" class="branch-list"></div>
</div>

<!-- ================= 일시정지 ================= -->
<div id="pauseOverlay" class="overlay hidden">
  <div class="panel pause-panel">
    <h2>일시정지</h2>
    <button class="btn primary" id="resumeBtn">계속하기</button>
    <button class="btn ghost" id="soundBtn">효과음: 켜짐</button>
    <button class="btn ghost" id="cryBtn">울음소리: 켜짐</button>
    <button class="btn danger" id="quitBtn">로비로 나가기</button>
    <p class="tiny">나가면 이번 판 보상은 사라져요</p>
  </div>
</div>

<div id="toastRoot"></div>
<div id="loading" class="loading">
  <div class="pokeball"></div>
  <div class="loading-text">포켓몬을 불러오는 중…<span id="loadPct">0%</span></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
